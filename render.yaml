# Render Blueprint — FastAPI/uvicorn backend (the React frontend goes on Vercel).
#
#   1. Push this repo to GitHub.
#   2. Render dashboard → New → Blueprint → pick this repo. It reads render.yaml.
#   3. After the first deploy, set the secret/URL env vars marked `sync: false`
#      (see DEPLOY.md), then redeploy.
#
# Builds the existing Dockerfile.api. The 1.8 GB dataset is NOT in the image
# (it's git-ignored); it lives on the persistent disk below and is fetched at
# boot by render-start.sh from DATASET_URL_WEST/EAST when present.

services:
  - type: web
    name: ufosint-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    # Render injects $PORT and ignores the Dockerfile CMD/HEALTHCHECK; this
    # script downloads the datasets (if URLs are set) then binds uvicorn to $PORT.
    dockerCommand: bash ./render-start.sh
    # torch + e5-large embeddings + the in-memory dataset are RAM-hungry.
    # `standard` (2 GB) boots and runs parsing/RAG/SCU fine; the full
    # embedding/UMAP/HDBSCAN pipeline on the 1.8 GB dataset wants `pro` (4 GB)
    # or `pro plus` (8 GB). Bump in the dashboard or here as needed.
    plan: standard
    healthCheckPath: /api/dashboard/summary
    autoDeploy: true
    envVars:
      # "production" runs the real pipeline; "mock" is a fast demo backend.
      - key: UAP_ANALYSIS_MODE
        value: production
      # Comma-separated allowlist of frontend origins. Set this to your Vercel
      # URL(s) after the frontend is deployed, then redeploy (see DEPLOY.md).
      - key: UAP_API_CORS_ORIGINS
        sync: false
      # Keep the HF model cache (e5-large ~1.3 GB) and datasets on the disk so
      # they survive restarts instead of re-downloading every cold start.
      - key: HF_HOME
        value: /data/huggingface
      - key: UAP_DATASET_WEST
        value: /data/parsed_files_distance_embeds.h5
      - key: UAP_DATASET_EAST
        value: /data/final_ufoseti_dataset.h5
      # Optional: direct/presigned URLs to the .h5 files (R2/S3/HF/etc.).
      # render-start.sh downloads them to the disk on first boot only. Leave
      # unset to deploy without the pre-parsed dataset (parsing/RAG/SCU still
      # work; the Data Explorer "load dataset" action returns 404 until set).
      - key: DATASET_URL_WEST
        sync: false
      - key: DATASET_URL_EAST
        sync: false
    disk:
      name: uap-data
      mountPath: /data
      sizeGB: 10
