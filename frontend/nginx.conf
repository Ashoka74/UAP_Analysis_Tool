server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Dataset uploads (CSV/XLSX/JSON) can be tens of MB.
    client_max_body_size 200m;

    # Backend API — `api` is the service name on the compose network.
    # Resolved per-request via Docker's embedded DNS (127.0.0.11) so nginx
    # still starts when the api container is absent (502 instead of crash).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Analysis / magnetic runs are long (UMAP+HDBSCAN, BGS fetches up to
        # 240 s) — don't let nginx cut them off at the default 60 s.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
